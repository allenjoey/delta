---
  - hosts: '*'
    become: true
       
    tasks:    
    
    - name: upgrade all packages CentOS RedHat 6-7
      ansible.builtin.yum:
        name: '*' 
        update_cache: true
        state: latest
      when: ansible_pkg_mgr == "yum"

    - name: upgrade all packages Rocky RedHat 8-9 
      ansible.builtin.dnf:
        name: '*'
        update_cache: true
        state: latest
      when: ansible_pkg_mgr == "dnf"

    - name: upgrade all packages Debian or Ubuntu
      ansible.builtin.apt:
        name: '*'
        update_cache: true
        cache_valid_time: 3600
        state: latest        
      when: ansible_pkg_mgr == "apt"     
...