---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: jenkins
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/allenjoey/delta.git
    targetRevision: main
    path: K8s/jenkins-server/jenkins-server/kustomize
  destination:
    server: https://kubernetes.default.svc
    namespace: jenkins-server
  syncPolicy:
    automated:
      prune: true       # removes resources deleted from Git
      selfHeal: true    # reverts manual kubectl changes
    syncOptions:
      - CreateNamespace=true
