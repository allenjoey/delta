---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    io.kompose.service: jenkins
  name: jenkins
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: jenkins
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        io.kompose.service: jenkins
    spec:
      initContainers:
        - name: install-docker-cli
          image: docker:latest
          command: ['sh', '-c', 'cp /usr/local/bin/docker /docker-bin/docker']
          volumeMounts:
            - mountPath: /docker-bin
              name: docker-bin
      containers:
        - name: jenkins-lts
          image: jenkins/jenkins:lts-jdk21
          env:
            - name: DOCKER_CERT_PATH
              value: /certs/client
            - name: DOCKER_HOST
              value: tcp://jenkins-docker:2376
            - name: DOCKER_TLS_VERIFY
              value: "1"
          ports:
            - containerPort: 8080
              protocol: TCP
            - containerPort: 50000
              protocol: TCP
          volumeMounts:
            - mountPath: /var/jenkins_home
              name: jenkins-data
            - mountPath: /certs/client
              name: jenkins-docker-certs
              readOnly: true
            - mountPath: /usr/local/bin/docker
              name: docker-bin
              subPath: docker
      volumes:
        - name: docker-bin
          emptyDir: {}
        - name: jenkins-data
          persistentVolumeClaim:
            claimName: jenkins-data
        - name: jenkins-docker-certs
          persistentVolumeClaim:
            claimName: jenkins-certs
            readOnly: true